# Configuração do verificador de links (https://github.com/lycheeverse/lychee)
# Uso: lychee --no-progress './**/*.md'
#
# Retries/concorrência reduzidos para evitar falsos positivos por rate limit.
max_retries = 6
retry_wait_time = 8
max_concurrency = 8
max_redirects = 10
accept = [200, 206, 301, 302, 303, 307, 308]

# Domínios verificados manualmente nesta sessão (curl com UA de navegador real,
# resposta HTTP 200 confirmada) mas que bloqueiam verificadores automatizados
# (400/403/429/999, anti-bot ou rate limit) — excluídos para não gerar falso-negativo.
# O LinkedIn responde HTTP 999 e o Facebook HTTP 400 a qualquer verificador
# automatizado (bloqueio anti-bot), mesmo com o perfil/página no ar. O Catho
# responde HTTP 403 ao lychee mas HTTP 200 ao curl com User-Agent de navegador
# real (confirmado manualmente nesta sessão) — mesmo padrão de bloqueio anti-bot.
exclude = [
    "^https://www\\.linkedin\\.com/",
    "^https://(www\\.)?facebook\\.com/",
    "^https://(www\\.)?catho\\.com\\.br/",
]

[hosts."www.youtube.com"]
concurrency = 2
